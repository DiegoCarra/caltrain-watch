name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened]
  schedule:
    # Changing the cron also reactivates the previously inactive workflow.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
      issues: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install data dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Select daily schedule cache
        id: schedule-cache
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache official GTFS schedule
        uses: actions/cache@v4
        with:
          path: .cache/511
          key: gtfs-${{ vars.TRANSIT_511_OPERATOR_ID || 'CT' }}-${{ steps.schedule-cache.outputs.day }}
          restore-keys: |
            gtfs-${{ vars.TRANSIT_511_OPERATOR_ID || 'CT' }}-

      - name: Build current Caltrain snapshot
        env:
          TRANSIT_511_API_KEY: ${{ secrets.TRANSIT_511_API_KEY }}
          TRANSIT_511_OPERATOR_ID: ${{ vars.TRANSIT_511_OPERATOR_ID || 'CT' }}
        shell: bash
        run: |
          python scripts/build_data.py --output public/data/caltrain.json
          touch public/.nojekyll
          python -m json.tool public/data/caltrain.json >/dev/null

      - name: Build rider explanation snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_reports.py --caltrain public/data/caltrain.json --output public/why/reports.json
          python -m json.tool public/why/reports.json >/dev/null

      # A real weekly data archive keeps source useful and avoids GitHub's
      # 60-day inactivity cutoff. GITHUB_TOKEN pushes do not trigger a run loop.
      - name: Archive a weekly official snapshot
        if: github.event_name == 'schedule'
        run: python scripts/archive_snapshot.py

      - name: Read GitHub Pages configuration
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
